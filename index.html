<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walnutle</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#000;--card:#fff;--line:#cfcfcf;--accent:#000;--btnfg:#fff;--g:#4caf50;--y:#e0a800;--r:#c94c4c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--card:#111;--line:#444;--accent:#fff;--btnfg:#000}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--card:#111;--line:#444;--accent:#fff;--btnfg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{max-width:860px;margin:0 auto}
h1{text-align:center;color:var(--fg);margin:8px 0 2px;letter-spacing:.08em;text-transform:uppercase}
p.sub{text-align:center;margin:0 0 16px;opacity:.75}
.row{display:flex;gap:8px}
input[type=text]{flex:1;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px}
button{padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--btnfg);font-size:16px;cursor:pointer}
button:disabled{opacity:.4}
#msg{min-height:24px;margin:10px 0;text-align:center;font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;margin:0 auto;min-width:100%}
th{font-size:12px;text-transform:uppercase;opacity:.7;padding:4px}
td{padding:10px 6px;border-radius:8px;text-align:center;color:#fff;font-weight:600;font-size:14px;min-width:80px}
td.g{background:var(--g)}td.y{background:var(--y)}td.r{background:var(--r)}
td.n{background:var(--card);color:var(--fg);border:1px solid var(--line);text-align:left}
details{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
textarea{width:100%;height:90px;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
small{opacity:.7}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:var(--card);color:var(--fg);border:2px solid var(--fg);border-radius:14px;padding:24px;max-width:340px;text-align:center}
.box h2{margin:0 0 8px}.box .row{justify-content:center}
.lb{margin:24px auto 0;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.lb h3{margin:0 0 4px}.lr{display:flex;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px}
a{color:var(--fg)}
</style></head>
<body><main>
<h1>Walnutle</h1>
<p class="sub">Guess the mystery Walnut Media employee. <span id="tries"></span></p>
<p class="sub">Playing as <b id="who"></b> <a href="#" id="ren">change</a> &middot; <span id="st"></span></p>
<div class="row"><input id="g" type="text" list="names" placeholder="Type a name..." autocomplete="off"><button id="go">Guess</button></div>
<datalist id="names"></datalist>
<div id="msg"></div>
<div class="scroll"><table id="t"></table></div>
<p style="text-align:center"><small>🟩 match · 🟨 partial overlap · 🟥 no match · ▲▼ answer is higher/lower</small></p>
<div id="lb" class="lb" style="display:none"><h3>Leaderboard</h3><div id="rows"></div><small>Points: 100 for a first-guess win, 10 less for each extra guess.</small></div>
<div id="modal" class="ov"><div class="box"><div id="mbody"></div><div class="row" style="margin-top:14px"><button id="share">Copy result</button><button id="close">Close</button></div></div></div>
</main>
<script>
const SAMPLE=`Name,Gender,Department,Office,Start Year,Status
Alex Rivera,Male,Editorial,Omaha,2016,Current
Jordan Lee,Female,Design,Omaha,2019,Current
Sam Patel,Male,Video,Remote,2021,Current
Taylor Brooks,Female,Sales,Chicago,2014,Former
Morgan Diaz,Female,Editorial,Chicago,2018,Former
Casey Nguyen,Male,Design,Remote,2022,Current
Riley Adams,Female,Video,Omaha,2017,Current
Drew Carter,Male,Sales,Omaha,2013,Former
Jamie Foster,Female,Operations,Remote,2020,Current
Chris Walker,Male,Operations,Chicago,2015,Former`;
const MAX=8;
const ENDPOINT="https://script.google.com/macros/s/AKfycbw5sRZ7Dw0YDoYotwvQcyPpghRTzBvST2s7jWCWH_v7HfgK9ZeUz2ZxS_LbzSawRmaC/exec"; // paste your Google Apps Script web app URL here to turn on the shared leaderboard
let H=[],P=[],ans=null,guesses=[],done=false;
const $=id=>document.getElementById(id);
function parseCSV(s){const rows=[];let r=[],c="",q=false;
 for(let i=0;i<s.length;i++){const ch=s[i];
  if(q){if(ch=='"'){if(s[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&s[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=""}
  else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}
 return rows.filter(x=>x.some(v=>v.trim()))}
function load(text){
 const rows=parseCSV(text);if(rows.length<2){$('msg').textContent="Need a header row and at least 1 person.";return}
 H=rows[0].map(h=>h.trim());
 P=rows.slice(1).map(r=>H.map((_,i)=>(r[i]||"").trim()));
 $('names').innerHTML=P.map(p=>`<option value="${p[0].replace(/"/g,'&quot;')}">`).join("");
 start()}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dailyPick(){
 const s=new Date().toLocaleDateString('en-CA',{timeZone:'America/Chicago'});
 const day=Math.floor(Date.parse(s+'T00:00:00Z')/86400000),n=P.length;
 const order=P.map((_,i)=>i).sort((a,b)=>P[a][0].localeCompare(P[b][0]));
 const r=rng(Math.floor(day/n)+12345);
 for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 return P[order[day%n]]}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ls(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function setls(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function todayStr(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Chicago'})}
function save(){setls('wl-state',{day:todayStr(),g:guesses.map(x=>x[0])})}
function pid(){let i=ls('wl-id');if(!i){i=Math.random().toString(36).slice(2,12);setls('wl-id',i)}return i}
function pname(){
  let n=ls('wl-name');

  if(!n){
    n=prompt("Enter your name for the Walnutle leaderboard:");

    if(n && n.trim()){
      n=n.trim().slice(0,20);
    }else{
      n="Player #"+Math.floor(1000+Math.random()*9000);
    }

    setls('wl-name',n);
  }

  return n;
}function stats(){const s=ls('wl-stats')||{streak:0,points:0};$('who').textContent=pname();$('st').textContent=`🔥 ${s.streak} day streak · ${s.points} pts`}
$('ren').onclick=e=>{e.preventDefault();const n=prompt("Your name for the leaderboard:",pname());if(n&&n.trim()){setls('wl-name',n.trim().slice(0,20));stats()}};
let shareTxt="";
function win(){
 const s=ls('wl-stats')||{streak:0,best:0,points:0,wins:0,last:""},t=todayStr();
 const y=new Date(Date.parse(t+'T00:00:00Z')-864e5).toISOString().slice(0,10);
 const pts=110-10*guesses.length;
 if(s.last!==t){s.streak=s.last===y?s.streak+1:1;s.best=Math.max(s.best||0,s.streak);s.points+=pts;s.wins++;s.last=t;setls('wl-stats',s);submit(pts)}
 const em={g:'🟩',y:'🟨',r:'🟥'};
 shareTxt=`Walnutle ${t} ${guesses.length}/${MAX}\n`+guesses.map(g=>H.slice(1).map((_,k)=>em[cell(k+1,g).c]).join("")).join("\n");
 $('mbody').innerHTML=`<h2>We have a winner!</h2><p>It was <b>${esc(ans[0])}</b>.<br>Solved in ${guesses.length} · +${pts} points<br>🔥 ${s.streak} day streak</p>`;
 $('modal').style.display='flex';$('msg').textContent=`You got it in ${guesses.length}!`;stats()}
function showCompletedWin(){
  const s=ls('wl-stats')||{streak:0,points:0};
  const pts=110-10*guesses.length;

  $('msg').innerHTML=
    `🎉 You already solved today's Walnutle in <b>${guesses.length}</b> guesses! `+
    `+${pts} points · Total: <b>${s.points} pts</b>`;

  stats();
}
function lose(){const s=ls('wl-stats')||{streak:0,points:0};s.streak=0;setls('wl-stats',s);$('msg').textContent=`Out of guesses. It was ${ans[0]}.`;stats()}
function submit(pts){if(!ENDPOINT)return;
 fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({day:todayStr(),id:pid(),name:pname(),points:pts})}).then(()=>setTimeout(board,1500)).catch(()=>{})}
function board(){
  $('lb').style.display='block';

  if(!ENDPOINT){
    $('rows').innerHTML="<small>Leaderboard is not connected yet.</small>";
    return;
  }

  $('rows').innerHTML="<small>Loading leaderboard...</small>";

  fetch(ENDPOINT)
    .then(r=>{
      if(!r.ok) throw new Error("Leaderboard request failed");
      return r.json();
    })
    .then(rows=>{
      $('rows').innerHTML=
        rows.map((r,i)=>`
          <div class="lr">
            <span>${i+1}. ${esc(r.name)}</span>
            <b>${esc(r.points)} pts</b>
          </div>
        `).join("") ||
        "<small>No winners yet.</small>";
    })
    .catch(()=>{
      $('rows').innerHTML=
        "<small>Leaderboard temporarily unavailable.</small>";
    });
}
$('close').onclick=()=>{$('modal').style.display='none'};
$('share').onclick=()=>{try{navigator.clipboard.writeText(shareTxt);$('share').textContent="Copied!"}catch(e){}};
function start(){
  ans=dailyPick();
  guesses=[];
  done=false;
  $('msg').textContent="";

  const saved=ls('wl-state');

  // Restore today's guesses
  if(saved && saved.day===todayStr() && Array.isArray(saved.g)){
    guesses=saved.g
      .map(name=>P.find(p=>p[0]===name))
      .filter(Boolean);
  }

  // Determine whether today's game was already finished
  if(guesses.length){
    const lastGuess=guesses[guesses.length-1];

    if(lastGuess && lastGuess[0]===ans[0]){
      done=true;
    }else if(guesses.length>=MAX){
      done=true;
    }
  }

  render();
  board();

  // Restore finished state
  if(done){
    const lastGuess=guesses[guesses.length-1];

    if(lastGuess && lastGuess[0]===ans[0]){
      showCompletedWin();
    }else{
      $('msg').textContent=`Today's game is complete. It was ${ans[0]}.`;
    }
  }
}
const isNum=i=>P.every(p=>!p[i]||!isNaN(+p[i]));
const vals=v=>v.split(";").map(x=>x.trim().toLowerCase()).filter(Boolean);
function cell(i,g){
 const a=ans[i],v=g[i];
 if(v.toLowerCase()===a.toLowerCase())return{c:"g",t:v};
 if(isNum(i)&&v!==""&&a!=="")return{c:"r",t:v+(+a>+v?" ▲":" ▼")};
 const A=vals(a),B=vals(v);
 if(A.length>1||B.length>1){if(B.some(x=>A.includes(x)))return{c:"y",t:v}}
 return{c:"r",t:v||"—"}}
function render(){
 $('tries').textContent=`(${guesses.length}/${MAX} guesses)`;
 let h="<tr>"+H.map((x,i)=>i?`<th>${x}</th>`:"<th>Guess</th>").join("")+"</tr>";
 for(const g of [...guesses].reverse()){
  h+="<tr><td class='n'>"+g[0]+"</td>"+H.slice(1).map((_,k)=>{const r=cell(k+1,g);return`<td class='${r.c}'>${r.t}</td>`}).join("")+"</tr>"}
 $('t').innerHTML=guesses.length?h:"";
 $('go').disabled=done}
function guess(){
 if(done)return;
 const n=$('g').value.trim().toLowerCase();
 const p=P.find(x=>x[0].toLowerCase()===n);
 if(!p){$('msg').textContent="Pick a name from the list.";return}
 if(guesses.includes(p)){$('msg').textContent="Already guessed!";return}
 guesses.push(p);$('g').value="";$('msg').textContent="";
 save();
 if(p===ans){done=true;win()}
 else if(guesses.length>=MAX){done=true;lose()}
 render()}
$('go').onclick=guess;
$('g').addEventListener('keydown',e=>{if(e.key==="Enter")guess()});
fetch('employees.csv').then(r=>{if(!r.ok)throw 0;return r.text()}).then(load).catch(()=>load(SAMPLE));
</script></body></html>
